{% extends "base.html" %}
{% block content %}
<p>Have an event link? Open it directly. Otherwise, enter the event code and your name.</p>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post" action="/claim">
  <label>
    Event code
    <input name="code" required autocomplete="off">
  </label>
  <label>
    Your name
    <input name="name" required autocomplete="off">
  </label>
  <button type="submit">Get my link</button>
</form>

<section>
  <h2>Start an event</h2>
  <p class="muted">You'll get a private link to run it. Keep that link safe; it's the only way back in.</p>
  <form method="post" action="/events">
    <label>
      Event name
      <input name="name" required maxlength="100" autocomplete="off" placeholder="e.g. Office Christmas 2026">
    </label>
    <button type="submit">Create event</button>
  </form>
</section>
{% endblock %}
