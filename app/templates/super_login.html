{% extends "base.html" %}
{% block content %}
<h2>Admin login</h2>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post" action="/admin/login">
  <label>
    Password
    <input type="password" name="password" required>
  </label>
  <button type="submit">Log in</button>
</form>

<p class="muted"><a href="/">Back to participant page</a></p>
{% endblock %}
